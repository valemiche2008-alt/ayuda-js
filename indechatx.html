<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    />

    <title>SPA CRUD Tareas</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-900 text-white min-h-screen">

    <div class="max-w-4xl mx-auto p-8">

        <h1
            class="text-4xl font-bold text-center mb-8"
        >
            Gestor de tareas SPA
        </h1>

        <!-- formulario -->

        <div
            class="bg-slate-800 p-6 rounded-xl shadow-lg"
        >

            <input
                id="title"
                type="text"
                placeholder="Nombre de tarea"
                class="w-full p-3 rounded text-black mb-4"
            />

            <select
                id="priority"
                class="w-full p-3 rounded text-black mb-4"
            >
                <option value="">
                    Seleccione prioridad
                </option>

                <option value="Alta">
                    Alta
                </option>

                <option value="Media">
                    Media
                </option>

                <option value="Baja">
                    Baja
                </option>
            </select>

            <button
                id="saveBtn"
                class="bg-green-600 w-full py-3 rounded"
            >
                Guardar tarea
            </button>

            <p
                id="error"
                class="text-red-400 mt-3"
            ></p>

        </div>

        <!-- lista -->

        <div
            id="taskList"
            class="mt-8 grid gap-4"
        ></div>

    </div>

    <script src="app.js"></script>
</body>
</html>
