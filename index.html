<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>E-commerce Malecon</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    />
  </head>
  <body>
    <header
      class="bg-stone-100 p-3 w-full flex justify-end shadow-lg shadow-zinc-200"
    >
      <button
      id="cartButton"
        class="text-lg border border-orange-400 rounded-full py-1 px-2 cursor-pointer hover:border-none text-orange-500 hover:bg-orange-400 hover:text-stone-100"
      >
        <i class="fa-solid fa-cart-arrow-down"></i>
      </button>
    </header>
    <main>
      <section
        id="products"
        class="h-full w-full p-3 grid grid-cols-3 space-x-3 space-y-3"
      >        
      </section>
    </main>
    <script src="main.js"></script>
  </body>
</html>
